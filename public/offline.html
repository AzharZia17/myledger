<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>My Ledger is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #18181b; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 360px); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #71717a; }
      a { display: inline-block; margin-top: 20px; color: #18181b; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect and try again. Transactions already saved on this device will sync when My Ledger is online.</p>
      <a href="/">Try My Ledger again</a>
    </main>
  </body>
</html>
